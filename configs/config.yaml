data_dir: data/raw
split_quantile: 0.8   # train on races before this date-quantile, test after

xgb_params:
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 5   # guards against overfitting to rare jockeys/trainers
  random_state: 42

ev_thresholds: [0.0, 0.05, 0.10, 0.20, 0.50]
